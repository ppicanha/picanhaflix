name: Disparar Notificação

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ manual-push-trigger ]

jobs:
  enviar-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar ferramentas necessárias
        run: npm install web-push firebase-admin

      - name: Executar o script de notificação
        run: node send-push.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          INPUT_TITLE: ${{ github.event.client_payload.title }}
          INPUT_BODY: ${{ github.event.client_payload.body }}