<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PicanhaFlix - Painel de Notificações</title>
  <style>
    body { font-family: sans-serif; background: #141414; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .card { background: #222; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; }
    input, textarea, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 4px; border: none; box-sizing: border-box; }
    button { background: #e50914; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #b80710; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Painel de Push - PicanhaFlix</h2>
    
    <label>Seu Personal Access Token do GitHub:</label>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">

    <label>Título da Notificação:</label>
    <input type="text" id="titulo" value="PicanhaFlix Novo Filme!">

    <label>Mensagem:</label>
    <textarea id="mensagem" rows="3">Confira o novo lançamento adicionado ao catálogo!</textarea>

    <button onclick="dispararPush()">Disparar Notificação Agora</button>
    
    <p id="status"></p>
  </div>

  <script>
    async function dispararPush() {
      const token = document.getElementById('githubToken').value;
      const titulo = document.getElementById('titulo').value;
      const mensagem = document.getElementById('mensagem').value;
      const status = document.getElementById('status');

      if (!token) {
        alert('Insira o Token do GitHub!');
        return;
      }

      status.innerText = 'Enviando comando...';

      try {
        const response = await fetch('https://api.github.com/repos/ppicanha/picanhaflix/dispatches', {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'manual-push-trigger',
            client_payload: {
              title: titulo,
              body: mensagem
            }
          })
        });

        if (response.ok || response.status === 204) {
          status.innerText = '🚀 Comando enviado com sucesso! O GitHub enviará a notificação em instantes.';
        } else {
          status.innerText = '❌ Erro ao enviar: ' + response.statusText;
        }
      } catch (err) {
        status.innerText = '❌ Erro de conexão: ' + err.message;
      }
    }
  </script>
</body>
</html>
